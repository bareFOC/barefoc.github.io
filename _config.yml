# BareFOC Documentation Configuration

title: "BareFOC"
description: "Embedded Rust Field Oriented Control (FOC) Library Documentation"

baseurl: "/"
url: "https://barefoc.github.io"
repository: "bareFOC/bareFOC"
github_repo: "bareFOC/bareFOC"

remote_theme: simplefoc/simplefoc-docs-theme

# Logo and favicon
logo: "assets/images/logo.png"
favicon_ico: "assets/images/favicon.ico"

# Search and navigation
search_enabled: true
heading_anchors: true

plugins:
  - jekyll-seo-tag
  - jekyll-toc
  - jekyll-remote-theme

# Exclude internal repository documentation and build files from website generation
exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github


# Footer content appears at the bottom of every page's main content
footer_content: "Copyright &copy; 2026. Distributed under the <a href=\"https://github.com/bareFOC/bareFOC/blob/main/LICENSE\">MIT license.</a>"

# External navigation links
nav_external_links:
  - title: "GitHub"
    url: https://github.com/bareFOC/bareFOC
    hide_icon: false
    fa_icon: "fab fa-github"
    opens_in_new_tab: true
  - title: "Crates.io"
    url: https://crates.io/crates/barefoc
    hide_icon: false
    fa_icon: "fas fa-cube"
    opens_in_new_tab: true
